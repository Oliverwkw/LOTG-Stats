[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotg"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The SQL query layer (lotg_support.db, scripts/sql.py, `fast.py sql`). Inquiry-only:
# the build never imports it, so it stays out of requirements.txt. pip install duckdb==1.4.5
sql = ["duckdb==1.4.5"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "lotg",
    "player_week",
    "player_year",
    "player_all_time",
    "team_week",
    "team_year",
    "team_all_time",
    "league_week",
    "league_year",
    "league_all_time",
    "transactions",
    "trades",
    "pick_history",
]

[tool.pytest.ini_options]
# -rfEs: the short summary names every failure, error AND skip with its reason.
# The weekly health email (scripts/audit_weekly.py, Part 3) reads the skip lines
# out of exports/raw/pytest.log, so a guard that quietly stopped running shows up.
addopts = "-rfEs"
