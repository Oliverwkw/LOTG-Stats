name: FAAB pipeline smoke test

# Runs the FAAB value pipeline end to end on a short window (Jan-Mar 2021, one fold bag) under the production
# toolchain (Python 3.11, pandas 3, live downloads) whenever a PR touches it. Writes nothing to the repo.

on:
  pull_request:
    paths:
      - "lib/lotg_support/faab_*.py"
      - "scripts/faab_*.py"
      - ".github/workflows/faab_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -c requirements.lock --no-cache-dir "pandas==3.0.6" "pyarrow==25.0.1" "numpy==2.4.6" "scipy==1.17.1" "scikit-learn==1.9.1" requests pyyaml pytest
      - name: Pipeline smoke (2021-01-01 .. 2021-09-20, 1 bag)
        env:
          FAAB_BAGS: "1"
        run: |
          set -euo pipefail
          mkdir -p /tmp/faab_smoke
          python scripts/faab_rebuild.py --end 2021-09-20 --out /tmp/faab_smoke
          python - <<'PY'
          import json, pandas as pd
          e = json.load(open("/tmp/faab_smoke/evidence.json")); x = pd.read_csv("/tmp/faab_smoke/inputs.csv")
          assert len(x) > 200 and x.V_raw.notna().mean() > 0.95, (len(x), x.V_raw.notna().mean())
          # the window holds the first 2021 trades (from 2021-08-29) and the September cuts; each is read on a board
          # on or before its own day, never more than a week earlier (before 2026-11-09 every later trade was valued
          # on the window's last board, which is what the old "> 20 trades" counted)
          assert len(e["trades"]) >= 3 and len(e["cuts"]) >= 10, (len(e["trades"]), len(e["cuts"]))
          for t in e["trades"]:
              for s in t["sides"]:
                  for _, d in s["players"]:
                      gap = (pd.Timestamp(t["date"]) - pd.Timestamp(d)).days
                      assert 0 <= gap <= 8, (t["date"], d)
          print("smoke ok:", len(x), "rows,", len(e["trades"]), "trades,", len(e["cuts"]), "cuts")
          PY
      - name: FAAB tests
        run: python -m pytest -q tests/test_faab_value.py tests/test_faab_pipeline.py
