name: Capture weekly injuries

# Snapshots Sleeper's live injury_status (and live participation) for every
# rostered player and commits it to data/injury_tracker.csv (PR E fix B).
#
# Runs Tuesdays 05:00 UTC (~1am ET) during the NFL season: comfortably after the
# week's Monday Night game — which can run past 03:30 UTC, so the old 04:00 slot
# had ~30 minutes of margin and a long game would have been captured mid-flight —
# and still 3 hours before the build's Tuesday 08:00 UTC "week is final" cutoff,
# so every week reaches the Tuesday 14:00 build with its snapshot in place.
#
# The cron fires on every Tuesday in September, including the ones BEFORE
# kickoff; the script derives its week from the fixed NFL schedule and exits
# cleanly when no regular-season week has started yet, so a pre-season run
# cannot file camp PUP/NFI designations as week 1. First real capture: 2026 wk1.
on:
  schedule:
    - cron: "0 5 * 9-12 2"   # Tuesdays 05:00 UTC, Sep–Dec
    - cron: "0 5 * 1 2"      # Tuesdays 05:00 UTC, January (week 18 tail)
  workflow_dispatch:
    inputs:
      season:
        description: "Override season (optional)"
        required: false
      week:
        description: "Override week (optional)"
        required: false
      force:
        description: "Replace an existing block for that week (needed with an explicit week)"
        type: boolean
        default: false
      dry_run:
        description: "Fetch and summarise only — do not write the CSV"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capture-injuries
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install --no-cache-dir pyyaml requests

      - name: Capture injury snapshot
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.season }}" ]; then ARGS="$ARGS --season ${{ github.event.inputs.season }}"; fi
          if [ -n "${{ github.event.inputs.week }}" ]; then ARGS="$ARGS --week ${{ github.event.inputs.week }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/capture_injuries.py $ARGS

      - name: Commit snapshot
        # A week's injury picture exists only while Sleeper is showing it, so a
        # push lost to a race is a week lost for good. Same reconcile-and-retry
        # shape as the build's export commit: rebase onto whatever landed while
        # we were fetching, then try again.
        run: |
          git config user.name "lotg-injury-bot"
          git config user.email "noreply@anthropic.com"
          git add data/injury_tracker.csv
          if git diff --cached --quiet; then
            echo "No change to injury_tracker.csv"
            exit 0
          fi
          git commit -m "Weekly Sleeper injury snapshot [skip ci]"
          push_ok=0
          for attempt in 1 2 3 4; do
            if git push; then push_ok=1; break; fi
            echo "Push failed (attempt $attempt) — reconciling with origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          if [ "$push_ok" != "1" ]; then
            echo "::error::Could not push the injury snapshot for this week."
            exit 1
          fi
