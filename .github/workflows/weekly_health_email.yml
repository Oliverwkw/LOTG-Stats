name: Weekly dataset-health email

# Phase 14 — the SECOND weekly email: a private dataset-health check mailed to the
# maintainer (config/digest.yaml `audit_recipients` / DIGEST_AUDIT_RECIPIENTS, =
# okeimweiss only). It runs a day after the Tuesday build has committed refreshed
# exports/ (and after the nflverse weekly feed has settled) and alerts on:
#   * DATASET BREAKAGES — the 3-part weekly audit (scripts/audit_weekly.py):
#       a completed-season row that changed, a sheet that lost/renamed a pinned
#       column, or a real (non-transient, non-current-season) build error.
#   * MISSED INJURIES — played in-season weeks with no capture in the Sleeper
#       injury tracker (scripts/injury_coverage.py).
#   * MISSED SCHEDULED RUNS — a weekly cycle that never completed
#       (lib/lotg_support/schedule_watch.py). This is the only failure in the
#       pipeline with NO artifact of its own: a late run is visible in the
#       Actions list and a broken one is a red X, but a run GitHub never
#       dispatched (2026-07-07) leaves nothing at all — while every other
#       section of this email goes on describing a week-old dataset as if it
#       were current. Read off the two committed completion stamps
#       (data/digest/ranks_snapshot.json, exports/snapshot/_snapshot_meta.json),
#       not the Actions API, because the question is whether the weekly CYCLE
#       finished, not whether a workflow object exists.
# It's a weekly heartbeat (sends even on a clean week), so a silent inbox means
# the check didn't run. Needs the DIGEST_KEY secret (same one the digest uses);
# a safe no-op (logged, green) when it's absent.
#
# FULL REBUILD WITH CACHE REGENERATION. This workflow does not audit the
# committed CSVs against an older committed version — it runs a complete build
# FROM SCRATCH and audits that against what is committed. Deliberately:
#
#   * No `actions/cache/restore` step, so the Actions NFLverse / KTC caches are
#     not layered over the checkout. On its own that is NOT enough to re-fetch
#     anything: `.cache` is committed to the repo, and the loaders only download
#     when a file is missing/empty or `force_refresh` is set — which the build
#     sets for the in-progress season only. Skipping the restore therefore used
#     to leave this job reading the COMMITTED cache for every completed season
#     while the Tuesday build read the (newer, restore-key-rolled) Actions cache
#     — two different upstream vintages, whose differences Part 1 then reported
#     as historical-immutability breakages that no code change could fix.
#     LOTG_REFRESH_EXTERNAL=1 below closes that gap: every season re-downloads,
#     so the diff really is "committed exports vs a rebuild from live upstream".
#     That is the only way to catch upstream data that changed underneath us, a
#     source that has started 403ing, or a value that simply does not reproduce —
#     none of which a cache-warm build can see. Each loader still falls back to
#     the committed copy if its download fails, so a flaky source degrades to
#     today's behaviour instead of failing the run.
#   * The baseline is the exports/ committed at HEAD, snapshotted BEFORE the
#     build overwrites the working tree. So Part 1 answers a sharper question
#     than it used to: "does a from-scratch rebuild still reproduce the data we
#     are shipping?" A completed-season row that differs is a reproducibility
#     failure.
#   * The freshly built caches are NOT saved and nothing is pushed
#     (`permissions: contents: read`) — this run observes, it never becomes the
#     source of truth. The Tuesday build owns exports/ and the caches.
#
# Cost: a cold-cache build re-fetches ~1k KTC player histories, so expect this to
# run well over the cache-warm build's time. It is weekly; that is the trade.
on:
  schedule:
    # Off the top of the hour: GitHub's schedule queue peaks at :00 and this
    # repo's runs are ~80 minutes late on median. Read-only report — a late or
    # dropped one costs a week's email and nothing else, so it takes the minute
    # move but no catch-up fire.
    - cron: "37 14 * * 3"   # Wednesday 14:37 UTC (~10:37 ET), after Tue build + nflverse
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-email:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Snapshot the committed exports (reproducibility baseline)
        # Must happen BEFORE the build below rewrites exports/ in place. These
        # are the CSVs the repo is currently shipping; the fresh build is diffed
        # against them.
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/baseline_exports"
          mkdir -p "$BASE"
          cp exports/*.csv "$BASE"/
          # `PH#N` indexes ONE frame written as two sheets, so the map that
          # resolves it lives beside the CSVs rather than in them
          # (lib/lotg_support/pick_index.py). Without it in the baseline every
          # PH# ref is unreadable, `_resolve_refs` returns None for the whole
          # cell, and a pointer cell that was merely RENUMBERED gets reported as
          # a diff even when its T# half resolves to the identical trade — 9 such
          # rows on the 2026-09-02 run.
          mkdir -p "$BASE/raw"
          cp exports/raw/pick_ref_index.csv "$BASE"/raw/ 2>/dev/null || \
            echo "note: no exports/raw/pick_ref_index.csv — PH# link deltas will be reported, not stripped"
          echo "BASELINE_DIR=$BASE" >> "$GITHUB_ENV"
          echo "Snapshotted $(ls "$BASE"/*.csv | wc -l) committed CSVs into $BASE"
          # Same idea for the NFLverse cache: these are the upstream files the
          # committed exports were built from. The build below re-downloads them
          # (LOTG_REFRESH_EXTERNAL=1), so diffing this snapshot against .cache
          # afterwards is exactly "what did NFLverse change since we shipped?".
          NV="$RUNNER_TEMP/baseline_nflverse"
          mkdir -p "$NV"
          cp .cache/nflverse_*.csv "$NV"/ 2>/dev/null || true
          echo "NFLVERSE_BEFORE=$NV" >> "$GITHUB_ENV"
          echo "Snapshotted $(ls "$NV" | wc -l) NFLverse cache files into $NV"

      - name: Install dependencies (including LOTG package)
        run: |
          mkdir -p exports/raw
          set -o pipefail
          python -m pip install --upgrade pip setuptools wheel 2>&1 | tee exports/raw/pip_install.log
          pip cache purge 2>&1 | tee -a exports/raw/pip_install.log || true
          pip install --no-cache-dir -r requirements.txt 2>&1 | tee -a exports/raw/pip_install.log
          pip install --no-cache-dir --no-build-isolation -e . 2>&1 | tee -a exports/raw/pip_install.log

      - name: Run LOTG build (cold cache — full regeneration)
        # No cache restore above, so this re-downloads NFLverse / DynastyProcess /
        # KTC from scratch on top of the committed .cache baseline. GITHUB_TOKEN
        # raises the API rate limit from 60/hour to 5000/hour — ktc.py hits the
        # commits API once per unique trade date, and without auth a cold build
        # runs out of quota partway through and silently leaves later trades N/A
        # (which would then read as a fake "breakage" in the diff below).
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Re-download NFLverse for EVERY season, not just the in-progress one.
          # Without this the completed seasons come straight off the committed
          # .cache and Part 1 compares two cache vintages instead of comparing
          # our build against live upstream data. See the header note above.
          LOTG_REFRESH_EXTERNAL: "1"
        run: |
          mkdir -p exports/raw
          set -o pipefail
          python -m lotg 2>&1 | tee exports/raw/runner.log

      - name: Run test suite against the fresh build
        # Part 3 of the audit reads exports/raw/pytest.log, so it must reflect
        # THIS build, not the committed one. Non-blocking: a failing guard is
        # something the email should report, not something that should stop it
        # being sent.
        continue-on-error: true
        env:
          PYTHONPATH: src:lib
          LOTG_EXPORTS: exports
        run: |
          set -o pipefail
          pip install --no-cache-dir pytest 2>&1 | tail -n 2
          python -m pytest tests/ -v 2>&1 | tee exports/raw/pytest.log

      - name: Injury-tracker coverage report
        continue-on-error: true
        env:
          PYTHONPATH: src:lib
        run: python scripts/injury_coverage.py --exports exports

      - name: Send the weekly dataset-health email
        env:
          PYTHONPATH: src:lib
          DIGEST_KEY: ${{ secrets.DIGEST_KEY }}
          DIGEST_AUDIT_RECIPIENTS: ${{ secrets.DIGEST_AUDIT_RECIPIENTS }}
        run: |
          python scripts/send_audit_email.py \
            --exports exports \
            --baseline "$BASELINE_DIR" \
            --nflverse-before "$NFLVERSE_BEFORE" \
            --nflverse-after .cache \
            --out "$RUNNER_TEMP/health_email.html"

      - name: Upload the fresh build + email for diagnosis
        # A flagged week needs the artifacts that produced the flag — the
        # rebuilt CSVs, the build/pytest logs, and the email as sent.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-health-${{ github.run_number }}
          path: |
            exports/*.csv
            exports/raw/pick_ref_index.csv
            exports/raw/build_debug.log
            exports/raw/runner.log
            exports/raw/pytest.log
            ${{ runner.temp }}/health_email.html
          retention-days: 14
          if-no-files-found: warn
