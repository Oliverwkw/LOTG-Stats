name: Sweep gameday injuries

# A gameday capture of Sleeper's injury designations, taken while they are still
# the ones the teams played under, and merged into the same week's row as the
# Tuesday final capture (see scripts/capture_injuries.py --mode sweep).
#
# WHY, given the Tuesday capture already exists: the Tuesday snapshot is a single
# point-in-time read taken two days after the games. A designation the team
# clears on Monday — a 21-day IR window opening, a suspension ending, a tag
# dropped early — is gone by then, and the week reads as a played 0.00 instead of
# a miss, which pollutes the same played-week denominators Bye? protects. A
# sweep sees it while it is still there. It also means a failed Tuesday run is no
# longer a permanently lost week.
#
# COST: this fires once a day, and the script exits in seconds unless the fixed
# NFL schedule says there is a game today. ~153 runs a season, ~58 of which do
# any work. It reads the schedule rather than the calendar on purpose: across
# 2024-2026 NFL gamedays land on Wednesday, Thursday, Friday, Saturday, Sunday
# AND Monday — 2026 opens on a Wednesday — and a game has been moved to a Tuesday
# before (2021 week 15). A weekday-restricted cron would need editing for each of
# those; this needs none.
#
# WHY THESE TIMES: after the inactive report for a Sunday window (90 minutes
# before kick-off) and before it kicks off, and after the final practice report
# for every other window. Night games (Thu/Sun/Mon 00:15-00:20 UTC) are still
# swept on their own gameday, hours before their inactives land — so those carry
# the practice-report designation, not the game-time one; the final capture
# settles them.
#
# DELAY IS THE REAL HAZARD HERE, and it is the one place in the tracker where a
# late run costs data outright. A sweep's windows are ~90 minutes wide (from the
# inactive report to the kickoff it precedes) and GitHub's schedule queue has
# never delivered a run in this repo on time: median ~80 minutes late, tail to
# 8h47m.
#
# A late sweep cannot corrupt anything — the merge takes the STRONGEST
# designation, `played` only ever accumulates True, and `on_bye` keeps the
# earliest non-blank — so the failure mode is silent LOSS, not damage.
#
# WHAT 2026 WEEK 1 MEASURED. Six sweeps fired, all six delivered, none inside
# the window it was placed in:
#
#   cron 15:35 ->  18:47 (+3h12m), 18:37 (+3h02m), 18:17 (+2h42m)
#   cron 19:35 ->  21:50 (+2h15m), 21:45 (+2h10m), 21:34 (+1h59m)
#
# So the 15:35 slot, whose whole purpose was to leave 85 minutes of headroom
# before the 17:00 kickoff, landed AFTER that kickoff three times out of three.
# Its 85-minute budget is not a budget this scheduler can be held to, and 15:30
# is a hard floor (any earlier reads a practice report, not an inactive list),
# so there is no version of "one fire, slightly earlier" that works.
#
# THE FIX IS AN ANTICIPATORY FIRE PER WINDOW, placed so that the whole measured
# delay band [+1h59m, +3h12m] lands inside the window:
#
#   13:39 -> 15:38 .. 16:51   inside (15:30 inactives .. 17:00 kick)
#   16:43 -> 18:42 .. 19:55   inside (18:35 inactives .. 20:05 kick)
#   20:53 -> 22:52 .. 00:05   inside (22:45 inactives .. 00:15 kick)
#
# and the existing 15:35 / 19:35 are KEPT as the fast-queue case: if the queue
# ever delivers on time, they are the fires that land in the window and the
# anticipatory ones read a practice report instead.
#
# NIGHT GAMES ARE NEW COVERAGE, not redundancy. Thursday, Sunday and Monday
# night games kick at 00:15-00:20 UTC, so their inactives land ~22:45 UTC —
# after every fire this workflow used to have. Those windows had NO fire at all:
# the designation the teams played a night game under was only ever settled by
# the Tuesday final capture, two days later, which is exactly the "a played 0.00
# instead of a miss" case the sweep exists to prevent. 2026 opened on a
# Wednesday night and closed week 1 on a Monday night, so that is two of week
# 1's sixteen games. The 20:53 anticipatory fire and the 22:53 on-time fire
# cover it.
#
# THE COST, stated plainly. Six fires a day instead of two: ~918 runs a season,
# of which ~58 do any work (the script reads the fixed schedule and exits in
# seconds when there is no game today). And the anticipatory fires widen one
# existing exposure rather than adding a new kind: a designation seen EARLIER in
# the week is more likely to be one the team later cleared, and the merge keeps
# the strongest. That is already true of every sweep — it is the deliberate
# trade behind strongest-wins — and `played` is still the corrective, so the
# residue is a player who was cleared before kickoff, dressed, and recorded no
# statistic. A swept gameday also gets a higher `captures` value; sweep_counts()
# only ever asks whether max() > 1.
on:
  schedule:
    - cron: "39 13 * 9-12,1 *"   # anticipatory: early-window inactives (15:30)
    - cron: "35 15 * 9-12,1 *"   # on-time:     early-window inactives (15:30)
    - cron: "43 16 * 9-12,1 *"   # anticipatory: late-window inactives (18:35)
    - cron: "35 19 * 9-12,1 *"   # on-time:     late-window inactives (18:35)
    - cron: "53 20 * 9-12,1 *"   # anticipatory: night-game inactives (22:45)
    - cron: "53 22 * 9-12,1 *"   # on-time:     night-game inactives (22:45)
  workflow_dispatch:
    inputs:
      week:
        description: "Override week (optional; normally read from the schedule)"
        required: false

permissions:
  contents: write

# Shared with capture_injuries.yml: both write data/injury_tracker.csv, so they
# must never run at the same time.
concurrency:
  group: injury-tracker-write
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install --no-cache-dir pyyaml requests

      - name: Sweep
        env:
          IN_WEEK: ${{ github.event.inputs.week }}
        run: |
          set -euo pipefail
          CMD=(python scripts/capture_injuries.py --mode sweep)
          if [ -n "${IN_WEEK:-}" ]; then CMD+=(--week "$IN_WEEK"); fi
          "${CMD[@]}"

      - name: Commit sweep
        run: |
          git config user.name "lotg-injury-bot"
          git config user.email "noreply@anthropic.com"
          git add data/injury_tracker.csv
          if git diff --cached --quiet; then
            echo "No game today, or no change to injury_tracker.csv"
            exit 0
          fi
          git commit -m "Gameday Sleeper injury sweep [skip ci]"
          push_ok=0
          for attempt in 1 2 3 4; do
            if git push; then push_ok=1; break; fi
            echo "Push failed (attempt $attempt) — reconciling with origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          if [ "$push_ok" != "1" ]; then
            echo "::error::Could not push the gameday injury sweep."
            exit 1
          fi
